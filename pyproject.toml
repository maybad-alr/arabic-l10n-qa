[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arabic-l10n-qa"
version = "0.1.0"
description = "Dependency-free QA linter for Arabic localization files (placeholders, HTML, bidi, punctuation)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["arabic", "localization", "l10n", "i18n", "qa", "rtl", "llm"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Internationalization",
  "Natural Language :: Arabic",
]

[project.scripts]
arabic-l10n-qa = "arabic_l10n_qa.cli:main"

[project.optional-dependencies]
yaml = ["PyYAML>=6"]

[tool.setuptools.packages.find]
where = ["src"]
