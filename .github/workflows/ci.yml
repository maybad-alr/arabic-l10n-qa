name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Self-check the examples
        run: arabic-l10n-qa examples/ar.json --source examples/en.json --format github
      - name: Verify gettext embedded-source detection
        run: |
          if arabic-l10n-qa examples/ar.po --format github; then
            echo "::error::expected a non-zero exit for the deliberately broken .po example"
            exit 1
          fi
          echo "embedded-source check behaved as expected"
